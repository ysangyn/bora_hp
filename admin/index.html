<html lang="ko">
<head>
<meta charset="utf-8">

<link rel="icon" type="image/png" sizes="32x32" href="../img/icon/icon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../assets/notes.css?v=1">
<script>try{if(localStorage.getItem('bora_theme')==='paper')document.documentElement.dataset.theme='paper'}catch(e){}</script>
<style>
.wrap{padding-bottom:120px}
.btn{appearance:none;border:1px solid var(--line);background:none;border-radius:999px;padding:9px 16px;font-size:13.5px;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.btn.lamp{background:var(--lamp);color:#1b1208;border-color:var(--lamp);font-weight:600}
.btn.sm{min-height:36px;padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:6px;margin:22px 0 6px;position:sticky;top:64px;z-index:4;background:var(--bg);padding:8px 0}
.tabs button{border:1px solid var(--line);background:none;border-radius:999px;padding:9px 16px;font-size:14px;cursor:pointer;color:var(--mut);min-height:42px}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.help{font-size:13px;color:var(--mut);line-height:1.7}
.list{list-style:none;margin:14px 0 0;padding:0}
.it{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.it.off{opacity:.45}
.it .thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--surf)}
.it .rec{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,var(--lamp) 0 4px,#1a1420 5px 8px,#0b080e 9px,#231c2a 10px,#0b080e 12px 100%)}
.it .f{display:flex;flex-direction:column;gap:8px;min-width:0}
.it input[type=text],.it select,.it textarea,.add input[type=text],.add select{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.it small,.meta3{font-size:12px;color:var(--mut)}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.tag.new{color:var(--lamp);border-color:var(--lamp)}
.add{margin-top:22px;padding:18px;background:var(--surf);border-radius:14px;display:flex;flex-direction:column;gap:10px}
.add b{font:600 16px/1.4 var(--serif)}
.views{display:flex;gap:8px}
.views figure{margin:0;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:11px;color:var(--mut)}
.views img,.views .ph{width:120px;height:72px;object-fit:cover;border-radius:6px;background:var(--bg);border:1px dashed var(--line)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(20px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--surf) 95%,transparent);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.savebar[hidden]{display:none}
.savebar span{font-size:13px;color:var(--lamp)}
.busy{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(5,3,8,.6);color:#fff;font-size:15px;text-align:center;padding:20px}
.busy[hidden]{display:none}
.card{background:var(--surf);border-radius:14px;padding:18px;margin-top:24px}
.card input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.warnline{font-size:12.5px;color:var(--lamp)}
</style>

<body>
<header class="bar"><a class="logo" href="../">보라다방</a><nav><a href="../notes/write/">노트 쓰기</a><button class="theme" type="button" aria-label="밤·종이 화면 바꾸기"><i></i></button></nav></header>
<main class="wrap" id="app"></main>
<div class="savebar" id="saveBar" hidden><span id="saveT">바뀐 내용이 있어요</span><div class="row"><button class="btn sm" id="undoAll" type="button">되돌리기</button><button class="btn lamp" id="saveAll" type="button">방에 올리기</button></div></div>
<div class="busy" id="busy" hidden><span id="busyT">올리는 중…</span></div>
<script type="module">
const REPO = 'ysangyn/bora_hp', BRANCH = 'main', ROOT = '../';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
let KEY = (() => { try { return localStorage.getItem('bora_wkey') || ''; } catch (e) { return ''; } })();
let tt = 0;
const toast = m => { let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); } t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2600); };
const busy = (on, t) => { $('#busy').hidden = !on; if (t) $('#busyT').textContent = t; };
$('.theme').onclick = () => { const r = document.documentElement, p = r.dataset.theme !== 'paper'; if (p) r.dataset.theme = 'paper'; else delete r.dataset.theme; try { localStorage.setItem('bora_theme', p ? 'paper' : 'night'); } catch (e) {} };
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

/* GitHub 저장소에 바로 쓰기 (노트 쓰기와 같은 열쇠) */
async function gh(path, opt = {}) {
  const r = await fetch('https://api.github.com' + path, { ...opt, cache: 'no-store', headers: { Authorization: 'Bearer ' + KEY, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opt.body ? { 'Content-Type': 'application/json' } : {}) } });
  if (!r.ok) { const e = new Error(r.status + ' ' + (await r.text()).slice(0, 160)); e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}
const encPath = p => p.split('/').map(encodeURIComponent).join('/');
const b64dec = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g, '')), c => c.charCodeAt(0)));
const utf8b64 = s => { const u = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(bin); };
const blobB64 = b => new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(String(f.result).split(',')[1]); f.onerror = rej; f.readAsDataURL(b); });
async function getJSON(path, d) { try { const j = await gh(`/repos/${REPO}/contents/${encPath(path)}?ref=${BRANCH}`); return JSON.parse(b64dec(j.content)); } catch (e) { if (e.status === 404) return d; throw e; } }
async function commit(files, msg) {
  for (let attempt = 0; attempt < 3; attempt++) {
    const ref = await gh(`/repos/${REPO}/git/ref/heads/${BRANCH}`), base = ref.object.sha, bc = await gh(`/repos/${REPO}/git/commits/${base}`), tree = [];
    for (const f of files) { const content = f.blob ? await blobB64(f.blob) : utf8b64(f.text);
      const b = await gh(`/repos/${REPO}/git/blobs`, { method: 'POST', body: JSON.stringify({ content, encoding: 'base64' }) }); tree.push({ path: f.path, mode: '100644', type: 'blob', sha: b.sha }); }
    const t = await gh(`/repos/${REPO}/git/trees`, { method: 'POST', body: JSON.stringify({ base_tree: bc.tree.sha, tree }) });
    const c = await gh(`/repos/${REPO}/git/commits`, { method: 'POST', body: JSON.stringify({ message: msg, tree: t.sha, parents: [base] }) });
    try { await gh(`/repos/${REPO}/git/refs/heads/${BRANCH}`, { method: 'PATCH', body: JSON.stringify({ sha: c.sha }) }); return; } catch (e) { if (e.status !== 422 || attempt === 2) throw e; }
  }
}

/* 소리 크기 재기(사람 귀 기준 LUFS 근사): 곡마다 -17에 맞춰 재생 볼륨만 낮춘다 → 파일·음질은 그대로 */
async function measureLufs(file) {
  const ac = new (window.AudioContext || window.webkitAudioContext)(); const buf = await ac.decodeAudioData(await file.arrayBuffer()); ac.close && ac.close();
  const sr = buf.sampleRate, off = new OfflineAudioContext(buf.numberOfChannels, buf.length, sr), src = off.createBufferSource(); src.buffer = buf;
  const hs = off.createBiquadFilter(); hs.type = 'highshelf'; hs.frequency.value = 1681; hs.gain.value = 4; const hp = off.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 38; hp.Q.value = .5;
  src.connect(hs).connect(hp).connect(off.destination); src.start(); const r = await off.startRendering();
  const blk = Math.round(sr * .4), hop = Math.round(sr * .1), ms = [];
  for (let s = 0; s + blk <= r.length; s += hop) { let z = 0; for (let ch = 0; ch < r.numberOfChannels; ch++) { const d = r.getChannelData(ch); for (let i = s; i < s + blk; i += 4) z += d[i] * d[i]; } ms.push(z / (blk / 4)); }
  const L = m => -0.691 + 10 * Math.log10(m || 1e-12);
  let g = ms.filter(m => L(m) > -70); if (!g.length) return { lufs: -70, dur: buf.duration };
  const rel = L(g.reduce((a, b) => a + b, 0) / g.length) - 10; g = g.filter(m => L(m) > rel);
  return { lufs: Math.round(L(g.reduce((a, b) => a + b, 0) / g.length) * 10) / 10, dur: buf.duration };
}
const gainOf = l => Math.round(Math.min(1, Math.pow(10, (-17 - l) / 20)) * 1000) / 1000;

/* 사진 줄이기(가로 최대 2048, 위치 정보 없이 다시 저장) */
async function shrink(file, max = 2048) {
  let bmp; try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height)), w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const g = cv.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(bmp, 0, 0, w, h);
  let blob = await new Promise(r => cv.toBlob(r, 'image/webp', .86)), ext = 'webp'; if (!blob || blob.type !== 'image/webp') { blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .88)); ext = 'jpg'; }
  return { blob, ext, w, h };
}

/* 상태 */
const D = { tracks: null, videos: null, views: null }, ORIG = {}, PEND = new Map();
let tab = 'tracks', dirty = new Set();
const FILES = { tracks: 'data/tracks.json', videos: 'data/videos.json', views: 'data/views.json' };
const mark = k => { dirty.add(k); $('#saveBar').hidden = false; $('#saveT').textContent = `바뀐 내용이 있어요 (${[...dirty].map(x => ({ tracks: '노래', videos: '영상', views: '창밖' })[x]).join('·')})`; };
async function loadAll() { for (const k of Object.keys(FILES)) { D[k] = await getJSON(FILES[k], []); ORIG[k] = JSON.stringify(D[k]); } }

function viewKey(err) {
  $('#app').innerHTML = `<h1 class="lt">주인장 방</h1><p class="ls">노트 쓰기에 넣은 것과 같은 '쓰기 열쇠'를 넣어 주세요.</p>
  <div class="card"><input type="password" id="kIn" placeholder="github_pat_…" autocomplete="off">${err ? `<p class="warnline">${esc(err)}</p>` : ''}<div class="row" style="margin-top:12px"><button class="btn pri" id="kOk" type="button">열쇠 넣기</button></div></div>`;
  $('#kOk').onclick = async () => { KEY = $('#kIn').value.trim(); if (!KEY) return; busy(true, '열쇠 확인 중…');
    try { const j = await gh(`/repos/${REPO}`); if (!(j.permissions && j.permissions.push)) throw new Error('이 열쇠로는 올릴 수 없어요.'); localStorage.setItem('bora_wkey', KEY); busy(false); start(); }
    catch (e) { busy(false); KEY = ''; viewKey(e.status === 401 ? '열쇠가 맞지 않아요.' : e.message); } };
}

function render() {
  const n = { tracks: D.tracks.length, videos: D.videos.length, views: D.views.length };
  $('#app').innerHTML = `<h1 class="lt">주인장 방</h1><p class="ls">방의 노래, 프로젝터 영상, 창밖 풍경을 고쳐요. 고친 뒤 아래 '방에 올리기'를 누르면 1~2분 뒤 방에 반영돼요.</p>
  <div class="tabs" role="tablist"><button type="button" data-tab="tracks" aria-pressed="${tab === 'tracks'}">노래 ${n.tracks}</button><button type="button" data-tab="videos" aria-pressed="${tab === 'videos'}">영상 ${n.videos}</button><button type="button" data-tab="views" aria-pressed="${tab === 'views'}">창밖 ${n.views}</button></div>
  <section id="pane"></section>`;
  $$('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  ({ tracks: paneTracks, videos: paneVideos, views: paneViews })[tab]();
}
const moveBtns = (k, i) => `<button class="btn sm" type="button" data-up="${i}" aria-label="위로" ${i === 0 ? 'disabled' : ''}>↑</button><button class="btn sm" type="button" data-dn="${i}" aria-label="아래로" ${i === D[k].length - 1 ? 'disabled' : ''}>↓</button><button class="btn sm" type="button" data-hide="${i}">${D[k][i].hide ? '다시 보이기' : '숨기기'}</button><button class="btn sm" type="button" data-del="${i}">빼기</button>`;
function wireList(k) {
  $$('[data-up]').forEach(b => b.onclick = () => { const i = +b.dataset.up; [D[k][i - 1], D[k][i]] = [D[k][i], D[k][i - 1]]; mark(k); render(); });
  $$('[data-dn]').forEach(b => b.onclick = () => { const i = +b.dataset.dn; [D[k][i + 1], D[k][i]] = [D[k][i], D[k][i + 1]]; mark(k); render(); });
  $$('[data-hide]').forEach(b => b.onclick = () => { const x = D[k][+b.dataset.hide]; x.hide = !x.hide; mark(k); render(); });
  $$('[data-del]').forEach(b => b.onclick = () => { D[k].splice(+b.dataset.del, 1); mark(k); render(); toast('목록에서 뺐어요. 올리기 전까지는 되돌릴 수 있어요.'); });
  $$('[data-edit]').forEach(el => el.oninput = el.onchange = () => { const [i, f] = el.dataset.edit.split(':'); D[k][+i][f] = el.value; mark(k); });
}

/* 노래 */
function paneTracks() {
  $('#pane').innerHTML = `<ul class="list">${D.tracks.map((t, i) => `<li class="it${t.hide ? ' off' : ''}"><div class="rec"></div><div class="f">
    <input type="text" data-edit="${i}:t" value="${esc(t.t)}" aria-label="곡 제목">
    <div class="row"><select data-edit="${i}:kind" aria-label="종류" style="width:auto"><option value="song"${t.kind !== 'sketch' ? ' selected' : ''}>노래 (턴테이블)</option><option value="sketch"${t.kind === 'sketch' ? ' selected' : ''}>습작 (스케치 노트)</option></select>${PEND.has(t.f) ? '<span class="tag new">새로 올림</span>' : ''}</div>
    ${t.kind === 'sketch' ? `<input type="text" data-edit="${i}:memo" value="${esc(t.memo || '')}" placeholder="한 줄 메모 (예: 2026.11 · 비 오던 밤에)">` : ''}
    <small>${esc(t.f)}${t.lufs != null ? ` · 소리 크기 ${t.lufs} → 자동으로 ×${t.g} 맞춤` : ''}</small>
    <div class="row"><button class="btn sm" type="button" data-play="${i}">▶ 들어 보기</button>${moveBtns('tracks', i)}</div></div></li>`).join('')}</ul>
  <div class="add"><b>곡 올리기</b><p class="help" style="margin:0">mp3나 m4a 파일을 고르면 소리 크기를 재서 다른 곡과 맞춰 둬요. 파일과 음질은 그대로예요. 한 곡에 40MB까지.</p>
    <input type="file" id="aFile" accept="audio/mpeg,audio/mp4,audio/x-m4a,.mp3,.m4a" multiple hidden><div class="row"><button class="btn pri" type="button" id="aPick">파일 고르기</button></div></div>`;
  wireList('tracks');
  let au = null; $$('[data-play]').forEach(b => b.onclick = () => { const t = D.tracks[+b.dataset.play]; if (au) { au.pause(); if (au._i === b.dataset.play) { au = null; return; } } au = new Audio(PEND.has(t.f) ? URL.createObjectURL(PEND.get(t.f)) : ROOT + t.f); au._i = b.dataset.play; au.volume = Math.min(1, t.g || 1); au.play().catch(() => toast('재생하지 못했어요')); });
  $('#aPick').onclick = () => $('#aFile').click();
  $('#aFile').onchange = async e => { const fs = [...e.target.files]; e.target.value = ''; for (const f of fs) {
      if (f.size > 40e6) { toast(f.name + ': 40MB가 넘어요'); continue; } busy(true, `'${f.name}' 소리 크기를 재는 중…`);
      try { const m = await measureLufs(f), ext = /\.m4a$/i.test(f.name) ? 'm4a' : 'mp3', path = `music/${rid()}.${ext}`; PEND.set(path, f);
        D.tracks.push({ f: path, t: f.name.replace(/\.[^.]+$/, ''), kind: 'song', g: gainOf(m.lufs), lufs: m.lufs }); mark('tracks'); }
      catch (err) { toast(f.name + ': 소리 파일을 읽지 못했어요'); } }
    busy(false); render(); };
}

/* 영상 */
const ytId = u => { const m = String(u).match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([\w-]{11})/) || String(u).match(/^([\w-]{11})$/); return m ? m[1] : null; };
function paneVideos() {
  $('#pane').innerHTML = `<ul class="list">${D.videos.map((v, i) => `<li class="it${v.hide ? ' off' : ''}"><img class="thumb" src="https://i.ytimg.com/vi/${esc(v.id)}/mqdefault.jpg" alt="" style="width:96px;height:54px"><div class="f">
    <input type="text" data-edit="${i}:t" value="${esc(v.t || '')}" placeholder="제목 (비우면 유튜브 제목)" aria-label="영상 제목">
    <div class="row"><select data-edit="${i}:kind" aria-label="종류" style="width:auto"><option value="mood"${v.kind !== 'mv' ? ' selected' : ''}>분위기 영상</option><option value="mv"${v.kind === 'mv' ? ' selected' : ''}>뮤직비디오</option></select><a class="btn sm" href="https://youtu.be/${esc(v.id)}" target="_blank" rel="noopener">유튜브에서 보기</a></div>
    <div class="row">${moveBtns('videos', i)}</div></div></li>`).join('')}</ul>
  <div class="add"><b>영상 넣기</b><p class="help" style="margin:0">유튜브 주소를 붙여 넣어요. 프로젝터에서 블라인드 위에 비춰요.</p>
    <input type="text" id="vUrl" placeholder="https://youtu.be/…" inputmode="url"><div class="row"><button class="btn pri" type="button" id="vAdd">넣기</button></div></div>`;
  wireList('videos');
  $('#vAdd').onclick = () => { const id = ytId($('#vUrl').value.trim()); if (!id) { toast('유튜브 주소를 확인해 주세요'); return; } if (D.videos.some(v => v.id === id)) { toast('이미 있는 영상이에요'); return; } D.videos.push({ id, kind: 'mood' }); mark('videos'); render(); };
}

/* 창밖 */
function paneViews() {
  $('#pane').innerHTML = `<p class="help">창밖 도시 고르기에 아내가 찍은 풍경을 더해요. 창문 너머로 보이도록 <b>가로 사진</b>이 좋아요. 낮·밤 사진을 하나씩 넣으면 그곳 시간에 맞춰 바뀌고, 하나만 넣으면 밤에는 자동으로 어둡게 보여요. 비·눈·불빛 효과는 그대로 입혀져요.</p>
  <ul class="list">${D.views.map((v, i) => `<li class="it${v.hide ? ' off' : ''}" style="grid-template-columns:1fr"><div class="f">
    <input type="text" data-edit="${i}:n" value="${esc(v.n)}" aria-label="이름">
    <small>${v.place ? esc(v.place) + ' · ' : ''}${(+v.lat).toFixed(3)}, ${(+v.lon).toFixed(3)}</small>
    <div class="views"><figure>${v.day ? `<img src="${esc(PEND.has(v.day) ? URL.createObjectURL(PEND.get(v.day)) : ROOT + v.day)}" alt="">` : '<div class="ph"></div>'}낮</figure><figure>${v.night ? `<img src="${esc(PEND.has(v.night) ? URL.createObjectURL(PEND.get(v.night)) : ROOT + v.night)}" alt="">` : '<div class="ph"></div>'}밤</figure></div>
    <div class="row"><button class="btn sm" type="button" data-ph="${i}:day">낮 사진 ${v.day ? '바꾸기' : '넣기'}</button><button class="btn sm" type="button" data-ph="${i}:night">밤 사진 ${v.night ? '바꾸기' : '넣기'}</button></div>
    <div class="row">${moveBtns('views', i)}</div></div></li>`).join('')}</ul>
  <div class="add"><b>새 창밖 만들기</b>
    <input type="text" id="wName" placeholder="이름 (예: 우리 집 창밖, 일산 호수공원)">
    <div class="row" style="flex-wrap:nowrap"><input type="text" id="wPlace" placeholder="어디인가요? (동네·주소, 날씨와 시간을 맞추는 데 써요)"><button class="btn" type="button" id="wFind">찾기</button></div>
    <small class="meta3" id="wOut"></small>
    <div class="row"><button class="btn pri" type="button" id="wAdd" disabled>만들기</button></div></div>
  <input type="file" id="phFile" accept="image/*" hidden>`;
  wireList('views');
  let found = null;
  $('#wFind').onclick = async () => { const q = $('#wPlace').value.trim(); if (!q) return; $('#wOut').textContent = '찾는 중…';
    try { const j = await (await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=1&accept-language=ko&q=${encodeURIComponent(q)}`)).json();
      if (!j.length) { $('#wOut').textContent = '못 찾았어요. 동네 이름으로 적어 주세요.'; found = null; } else { found = { lat: +j[0].lat, lon: +j[0].lon, cc: (j[0].address || {}).country_code || '', place: q }; $('#wOut').textContent = `찾았어요: ${j[0].display_name.split(',').slice(0, 3).join(',')}`; }
    } catch (e) { $('#wOut').textContent = '찾지 못했어요. 인터넷 연결을 확인해 주세요.'; }
    $('#wAdd').disabled = !found; };
  $('#wAdd').onclick = () => { const n = $('#wName').value.trim() || $('#wPlace').value.trim(); if (!found || !n) return; D.views.push({ id: rid(), n, ...found, day: '', night: '' }); mark('views'); render(); toast('만들었어요. 이제 낮·밤 사진을 넣어 주세요.'); };
  let target = null;
  $$('[data-ph]').forEach(b => b.onclick = () => { target = b.dataset.ph; $('#phFile').click(); });
  $('#phFile').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f || !target) return; const [i, which] = target.split(':'), v = D.views[+i];
    busy(true, '사진을 다듬는 중…'); try { const r = await shrink(f); if (r.h > r.w) toast('세로 사진은 창에 일부만 보여요. 가로 사진을 권해요.');
      const path = `img/views/${v.id}_${which === 'day' ? 'd' : 'n'}_${rid()}.${r.ext}`; PEND.set(path, r.blob); v[which] = path; v.ia = Math.round(r.w / r.h * 100) / 100; mark('views'); } catch (err) { toast('사진을 읽지 못했어요'); }
    busy(false); render(); };
}

/* 올리기 */
$('#saveAll').onclick = async () => {
  busy(true, '방에 올리는 중… (곡 파일이 크면 1분쯤 걸려요)');
  try { const files = [], used = new Set();
    for (const k of dirty) { files.push({ path: FILES[k], text: JSON.stringify(D[k], null, 1) });
      for (const x of D[k]) for (const p of [x.f, x.day, x.night]) if (p && PEND.has(p) && !used.has(p)) { used.add(p); files.push({ path: p, blob: PEND.get(p) }); } }
    await commit(files, '주인장 방: ' + [...dirty].join(', ')); for (const p of used) PEND.delete(p);
    for (const k of dirty) ORIG[k] = JSON.stringify(D[k]); dirty.clear(); $('#saveBar').hidden = true; busy(false); toast('올렸어요. 1~2분 뒤 방에 보여요.'); render();
  } catch (e) { busy(false); toast('올리지 못했어요 (' + (e.status || '연결') + '). 잠시 뒤 다시 해 주세요.'); console.warn(e); }
};
$('#undoAll').onclick = () => { for (const k of dirty) D[k] = JSON.parse(ORIG[k]); dirty.clear(); PEND.clear(); $('#saveBar').hidden = true; render(); };
window.addEventListener('beforeunload', e => { if (dirty.size) { e.preventDefault(); e.returnValue = ''; } });

async function start() {
  if (!KEY) return viewKey();
  $('#app').innerHTML = '<h1 class="lt">주인장 방</h1><p class="ls">불러오는 중…</p>';
  try { await loadAll(); render(); } catch (e) { if (e.status === 401) { localStorage.removeItem('bora_wkey'); KEY = ''; viewKey('열쇠가 맞지 않아요. 다시 넣어 주세요.'); } else $('#app').innerHTML = '<h1 class="lt">주인장 방</h1><p class="ls">불러오지 못했어요. 인터넷 연결을 확인해 주세요.</p>'; }
}
start();
</script>
</body>
