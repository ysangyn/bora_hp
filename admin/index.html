<style>
.wrap{padding-bottom:120px}
.btn{appearance:none;border:1px solid var(--line);background:none;border-radius:999px;padding:9px 16px;font-size:13.5px;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.btn.lamp{background:var(--lamp);color:#1b1208;border-color:var(--lamp);font-weight:600}
.btn.sm{min-height:36px;padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:6px;margin:22px -20px 6px;position:sticky;top:64px;z-index:4;background:var(--bg);padding:8px 20px;overflow-x:auto;scrollbar-width:none}

.it{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}

.it .thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--surf)}
.it .rec{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,var(--lamp) 0 4px,#1a1420 5px 8px,#0b080e 9px,#231c2a 10px,#0b080e 12px 100%)}
.it .f{display:flex;flex-direction:column;gap:8px;min-width:0}
.it input[type=text],.it select,.it textarea,.add input[type=text],.add select{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(20px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--surf) 95%,transparent);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

.card{background:var(--surf);border-radius:14px;padding:18px;margin-top:24px}
.card input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.warnline{font-size:12.5px;color:var(--lamp)}

.ped{position:fixed;inset:0;z-index:45;background:#0b0810;overflow:auto}
.ped .pin{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:12px;color:#efe8f4}

.ped .pchips button[aria-pressed=true]{background:#efe8f4;color:#120d18}

.bspn{width:22px;height:64px;border-radius:2px;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.1) 30%,rgba(0,0,0,.25)),var(--c);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.bed{display:flex;flex-direction:column;gap:14px;margin-top:16px}

.fld input,.fld select,.fld textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}

.sw button[aria-pressed=true]{border-color:var(--lamp)}

<body>
<header class="bar"><a class="logo" href="../">보라다방</a><nav><a href="../notes/write/">노트 쓰기</a><button class="theme" type="button" aria-label="밤·종이 화면 바꾸기"><i></i></button></nav></header>
<main class="wrap" id="app"></main>
<div class="savebar" id="saveBar" hidden><span id="saveT">바뀐 내용이 있어요</span><div class="row"><button class="btn sm" id="undoAll" type="button">되돌리기</button><button class="btn lamp" id="saveAll" type="button">방에 올리기</button></div></div>
<div class="busy" id="busy" hidden><span id="busyT">올리는 중…</span></div>
<script type="module">
import { renderFeed, renderSet, renderPhotoSitemap, PCATS, pcatName } from '../assets/photos-render.js';
const REPO = 'ysangyn/bora_hp', BRANCH = 'main', ROOT = '../';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
let KEY = (() => { try { return localStorage.getItem('bora_wkey') || ''; } catch (e) { return ''; } })();
let tt = 0;
const toast = m => { let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); } t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2600); };
const busy = (on, t) => { $('#busy').hidden = !on; if (t) $('#busyT').textContent = t; };
$('.theme').onclick = () => { const r = document.documentElement, p = r.dataset.theme !== 'paper'; if (p) r.dataset.theme = 'paper'; else delete r.dataset.theme; try { localStorage.setItem('bora_theme', p ? 'paper' : 'night'); } catch (e) {} };
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

/* GitHub 저장소에 바로 쓰기 (노트 쓰기와 같은 열쇠) */
async function gh(path, opt = {}) {
  const r = await fetch('https://api.github.com' + path, { ...opt, cache: 'no-store', headers: { Authorization: 'Bearer ' + KEY, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opt.body ? { 'Content-Type': 'application/json' } : {}) } });
  if (!r.ok) { const e = new Error(r.status + ' ' + (await r.text()).slice(0, 160)); e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}
const encPath = p => p.split('/').map(encodeURIComponent).join('/');
const b64dec = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g, '')), c => c.charCodeAt(0)));
const utf8b64 = s => { const u = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(bin); };
const blobB64 = b => new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(String(f.result).split(',')[1]); f.onerror = rej; f.readAsDataURL(b); });
async function getJSON(path, d) { try { const j = await gh(`/repos/${REPO}/contents/${encPath(path)}?ref=${BRANCH}`); return JSON.parse(b64dec(j.content)); } catch (e) { if (e.status === 404) return d; throw e; } }
async function commit(files, msg) {
  for (let attempt = 0; attempt < 3; attempt++) {
    const ref = await gh(`/repos/${REPO}/git/ref/heads/${BRANCH}`), base = ref.object.sha, bc = await gh(`/repos/${REPO}/git/commits/${base}`), tree = [];
    for (const f of files) { if (f.del) { tree.push({ path: f.path, mode: '100644', type: 'blob', sha: null }); continue; } const content = f.blob ? await blobB64(f.blob) : utf8b64(f.text);
      const b = await gh(`/repos/${REPO}/git/blobs`, { method: 'POST', body: JSON.stringify({ content, encoding: 'base64' }) }); tree.push({ path: f.path, mode: '100644', type: 'blob', sha: b.sha }); }
    const t = await gh(`/repos/${REPO}/git/trees`, { method: 'POST', body: JSON.stringify({ base_tree: bc.tree.sha, tree }) });
    const c = await gh(`/repos/${REPO}/git/commits`, { method: 'POST', body: JSON.stringify({ message: msg, tree: t.sha, parents: [base] }) });
    try { await gh(`/repos/${REPO}/git/refs/heads/${BRANCH}`, { method: 'PATCH', body: JSON.stringify({ sha: c.sha }) }); return; } catch (e) { if (e.status !== 422 || attempt === 2) throw e; }
  }
}

/* 소리 크기 재기(사람 귀 기준 LUFS 근사): 곡마다 -17에 맞춰 재생 볼륨만 낮춘다 → 파일·음질은 그대로 */
async function measureLufs(file) {
  const ac = new (window.AudioContext || window.webkitAudioContext)(); const buf = await ac.decodeAudioData(await file.arrayBuffer()); ac.close && ac.close();
  const sr = buf.sampleRate, off = new OfflineAudioContext(buf.numberOfChannels, buf.length, sr), src = off.createBufferSource(); src.buffer = buf;
  const hs = off.createBiquadFilter(); hs.type = 'highshelf'; hs.frequency.value = 1681; hs.gain.value = 4; const hp = off.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 38; hp.Q.value = .5;
  src.connect(hs).connect(hp).connect(off.destination); src.start(); const r = await off.startRendering();
  const blk = Math.round(sr * .4), hop = Math.round(sr * .1), ms = [];
  for (let s = 0; s + blk <= r.length; s += hop) { let z = 0; for (let ch = 0; ch < r.numberOfChannels; ch++) { const d = r.getChannelData(ch); for (let i = s; i < s + blk; i += 4) z += d[i] * d[i]; } ms.push(z / (blk / 4)); }
  const L = m => -0.691 + 10 * Math.log10(m || 1e-12);
  let g = ms.filter(m => L(m) > -70); if (!g.length) return { lufs: -70, dur: buf.duration };
  const rel = L(g.reduce((a, b) => a + b, 0) / g.length) - 10; g = g.filter(m => L(m) > rel);
  return { lufs: Math.round(L(g.reduce((a, b) => a + b, 0) / g.length) * 10) / 10, dur: buf.duration };
}
const gainOf = l => Math.round(Math.min(1, Math.pow(10, (-17 - l) / 20)) * 1000) / 1000;

/* 사진 줄이기(가로 최대 2048, 위치 정보 없이 다시 저장) */
async function shrink(file, max = 2048) {
  let bmp; try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height)), w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const g = cv.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(bmp, 0, 0, w, h);
  let blob = await new Promise(r => cv.toBlob(r, 'image/webp', .86)), ext = 'webp'; if (!blob || blob.type !== 'image/webp') { blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .88)); ext = 'jpg'; }
  return { blob, ext, w, h };
}

/* 상태 */
const D = { tracks: null, videos: null, views: null, photos: null, books: null }, ORIG = {}, PEND = new Map();
let tab = 'tracks', dirty = new Set();
const FILES = { tracks: 'data/tracks.json', videos: 'data/videos.json', views: 'data/views.json', photos: 'data/photos.json', books: 'data/books.json' };
const mark = k => { dirty.add(k); $('#saveBar').hidden = false; $('#saveT').textContent = `바뀐 내용이 있어요 (${[...dirty].map(x => ({ tracks: '노래', videos: '영상', views: '창밖', photos: '사진첩', books: '책장' })[x]).join('·')})`; };
async function loadAll() { for (const k of Object.keys(FILES)) { D[k] = await getJSON(FILES[k], []); ORIG[k] = JSON.stringify(D[k]); } }

function viewKey(err) {
  $('#app').innerHTML = `<h1 class="lt">주인장 방</h1><p class="ls">노트 쓰기에 넣은 것과 같은 '쓰기 열쇠'를 넣어 주세요.</p>
  <div class="card"><input type="password" id="kIn" placeholder="github_pat_…" autocomplete="off">${err ? `<p class="warnline">${esc(err)}</p>` : ''}<div class="row" style="margin-top:12px"><button class="btn pri" id="kOk" type="button">열쇠 넣기</button></div></div>`;
  $('#kOk').onclick = async () => { KEY = $('#kIn').value.trim(); if (!KEY) return; busy(true, '열쇠 확인 중…');
    try { const j = await gh(`/repos/${REPO}`); if (!(j.permissions && j.permissions.push)) throw new Error('이 열쇠로는 올릴 수 없어요.'); localStorage.setItem('bora_wkey', KEY); busy(false); start(); }
    catch (e) { busy(false); KEY = ''; viewKey(e.status === 401 ? '열쇠가 맞지 않아요.' : e.message); } };
}

function render() {
  const n = { tracks: D.tracks.length, videos: D.videos.length, views: D.views.length, photos: D.photos.length, books: D.books.length };
  $('#app').innerHTML = `<h1 class="lt">주인장 방</h1><p class="ls">방의 노래, 프로젝터 영상, 창밖 풍경, 사진첩, 책장을 고쳐요. 고친 뒤 아래 '방에 올리기'를 누르면 1~2분 뒤 방에 반영돼요.</p>
  <div class="tabs" role="tablist"><button type="button" data-tab="tracks" aria-pressed="${tab === 'tracks'}">노래 ${n.tracks}</button><button type="button" data-tab="videos" aria-pressed="${tab === 'videos'}">영상 ${n.videos}</button><button type="button" data-tab="views" aria-pressed="${tab === 'views'}">창밖 ${n.views}</button><button type="button" data-tab="photos" aria-pressed="${tab === 'photos'}">사진첩 ${n.photos}</button><button type="button" data-tab="books" aria-pressed="${tab === 'books'}">책장 ${n.books}</button></div>
  <section id="pane"></section>`;
  $$('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; editSet = null; editBook = null; render(); });
  ({ tracks: paneTracks, videos: paneVideos, views: paneViews, photos: panePhotos, books: paneBooks })[tab]();
}
const moveBtns = (k, i) => `<button class="btn sm" type="button" data-up="${i}" aria-label="위로" ${i === 0 ? 'disabled' : ''}>↑</button><button class="btn sm" type="button" data-dn="${i}" aria-label="아래로" ${i === D[k].length - 1 ? 'disabled' : ''}>↓</button><button class="btn sm" type="button" data-hide="${i}">${D[k][i].hide ? '다시 보이기' : '숨기기'}</button><button class="btn sm" type="button" data-del="${i}">빼기</button>`;
function wireList(k) {
  $$('[data-up]').forEach(b => b.onclick = () => { const i = +b.dataset.up; [D[k][i - 1], D[k][i]] = [D[k][i], D[k][i - 1]]; mark(k); render(); });
  $$('[data-dn]').forEach(b => b.onclick = () => { const i = +b.dataset.dn; [D[k][i + 1], D[k][i]] = [D[k][i], D[k][i + 1]]; mark(k); render(); });
  $$('[data-hide]').forEach(b => b.onclick = () => { const x = D[k][+b.dataset.hide]; x.hide = !x.hide; mark(k); render(); });
  $$('[data-del]').forEach(b => b.onclick = () => { D[k].splice(+b.dataset.del, 1); mark(k); render(); toast('목록에서 뺐어요. 올리기 전까지는 되돌릴 수 있어요.'); });
  $$('[data-edit]').forEach(el => el.oninput = el.onchange = () => { const [i, f] = el.dataset.edit.split(':'); D[k][+i][f] = el.value; mark(k); });
}

/* 노래 */
function paneTracks() {
  $('#pane').innerHTML = `<ul class="list">${D.tracks.map((t, i) => `<li class="it${t.hide ? ' off' : ''}"><div class="rec"></div><div class="f">
    <input type="text" data-edit="${i}:t" value="${esc(t.t)}" aria-label="곡 제목">
    <div class="row"><select data-edit="${i}:kind" aria-label="종류" style="width:auto"><option value="song"${t.kind !== 'sketch' ? ' selected' : ''}>노래 (턴테이블)</option><option value="sketch"${t.kind === 'sketch' ? ' selected' : ''}>습작 (책상 위 습작 노트)</option></select>${PEND.has(t.f) ? '<span class="tag new">새로 올림</span>' : ''}</div>
    ${t.kind === 'sketch' ? `<input type="text" data-edit="${i}:memo" value="${esc(t.memo || '')}" placeholder="한 줄 메모 (예: 2026.11 · 비 오던 밤에)">` : ''}
    <small>${esc(t.f)}${t.lufs != null ? ` · 소리 크기 ${t.lufs} → 자동으로 ×${t.g} 맞춤` : ''}</small>
    <div class="row"><button class="btn sm" type="button" data-play="${i}">▶ 들어 보기</button>${moveBtns('tracks', i)}</div></div></li>`).join('')}</ul>
  <div class="add"><b>곡 올리기</b><p class="help" style="margin:0">mp3나 m4a 파일을 고르면 소리 크기를 재서 다른 곡과 맞춰 둬요. 파일과 음질은 그대로예요. 한 곡에 40MB까지.</p>
    <input type="file" id="aFile" accept="audio/mpeg,audio/mp4,audio/x-m4a,.mp3,.m4a" multiple hidden><div class="row"><button class="btn pri" type="button" id="aPick">파일 고르기</button></div></div>`;
  wireList('tracks');
  let au = null; $$('[data-play]').forEach(b => b.onclick = () => { const t = D.tracks[+b.dataset.play]; if (au) { au.pause(); if (au._i === b.dataset.play) { au = null; return; } } au = new Audio(PEND.has(t.f) ? URL.createObjectURL(PEND.get(t.f)) : ROOT + t.f); au._i = b.dataset.play; au.volume = Math.min(1, t.g || 1); au.play().catch(() => toast('재생하지 못했어요')); });
  $('#aPick').onclick = () => $('#aFile').click();
  $('#aFile').onchange = async e => { const fs = [...e.target.files]; e.target.value = ''; for (const f of fs) {
      if (f.size > 40e6) { toast(f.name + ': 40MB가 넘어요'); continue; } busy(true, `'${f.name}' 소리 크기를 재는 중…`);
      try { const m = await measureLufs(f), ext = /\.m4a$/i.test(f.name) ? 'm4a' : 'mp3', path = `music/${rid()}.${ext}`; PEND.set(path, f);
        D.tracks.push({ f: path, t: f.name.replace(/\.[^.]+$/, ''), kind: 'song', g: gainOf(m.lufs), lufs: m.lufs }); mark('tracks'); }
      catch (err) { toast(f.name + ': 소리 파일을 읽지 못했어요'); } }
    busy(false); render(); };
}

/* 영상 */

/* 사진첩: 묶음(사진 1~10장 + 제목·분류·날짜·한두 줄) 단위. 사진마다 뒷면 메모. 다듬기(자르기·회전·밝기·대비·따뜻함·필터) */

      r = (r - 128) * con + 128 + br * 255 + warm * 28 + t[0]; gg = (gg - 128) * con + 128 + br * 255 + warm * 6 + t[1]; b = (b - 128) * con + 128 + br * 255 - warm * 28 + t[2];
      d[i] = r < 0 ? 0 : r > 255 ? 255 : r; d[i + 1] = gg < 0 ? 0 : gg > 255 ? 255 : gg; d[i + 2] = b < 0 ? 0 : b > 255 ? 255 : b; }

// 사진 다듬기 창
function openDevelop(set, idx) {
  const it = set.items[idx], o = ORIGF.get(it.src), E = Object.assign({ rot: 0, ratio: 0, ox: 0, oy: 0, b: 0, c: 0, w: 0, s: 0, preset: 0 }, o ? o.E : {});

    <div class="pstage"><canvas id="dCv"></canvas></div>
    <div class="pchips">${PRESETS.map((p, i) => `<button type="button" data-pr="${i}" aria-pressed="${E.preset === i}">${p.n}</button>`).join('')}</div>
    <div class="pchips">${RATIOS.map(([n, r]) => `<button type="button" data-ra="${r}" aria-pressed="${E.ratio === r}">${n}</button>`).join('')}<button type="button" id="dRot">↻ 돌리기</button></div>
    <label class="psl">밝기<input type="range" min="-40" max="40" value="${E.b}" data-k="b"></label>
    <label class="psl">대비<input type="range" min="-40" max="40" value="${E.c}" data-k="c"></label>
    <label class="psl">따뜻함<input type="range" min="-50" max="50" value="${E.w}" data-k="w"></label>
    <label class="psl">채도<input type="range" min="-60" max="40" value="${E.s}" data-k="s"></label>

  (async () => { busy(true, '사진을 여는 중…'); try { bmp = await bitmapOf(o ? o.file : ROOT + it.src); } catch (e) { toast('사진을 열지 못했어요'); } busy(false); draw(); })();
  wrap.querySelectorAll('[data-pr]').forEach(b => b.onclick = () => { E.preset = +b.dataset.pr; wrap.querySelectorAll('[data-pr]').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); });

      PEND.set(path, b); ORIGF.set(path, { file: o ? o.file : await (await fetch(ROOT + it.src)).blob(), E: { ...E } }); set.items[idx] = { ...it, src: path, w: c.width, h: c.height }; mark('photos'); }
    catch (e) { toast('적용하지 못했어요'); }
    busy(false); wrap.remove(); render(); };
}
// 올릴 때: 사진첩 페이지들(목록·묶음별)과 사진 사이트맵을 함께 굽는다
function photoFiles() {
  const vis = D.photos.filter(s => !s.hide && s.items.length).map(s => ({ ...s })), now = new Date().toISOString(), used = new Set();
  for (const s of D.photos) { if (!s.slug) { const base = s.date.slice(0, 10); let sl = base, n = 2; while (D.photos.some(x => x !== s && x.slug === sl) || used.has(sl)) sl = `${base}-${n++}`; s.slug = sl; } used.add(s.slug);
    if (s.date.length === 10) s.date = new Date(s.date + 'T21:00:00+09:00').toISOString(); s.updated = now; }
  const list = D.photos.filter(s => !s.hide && s.items.length).sort((a, b) => b.date.localeCompare(a.date)), out = [];
  list.forEach((s, i) => out.push({ path: `photos/${s.slug}/index.html`, text: renderSet(s, { prev: list[i + 1] || null, next: list[i - 1] || null }) }));
  out.push({ path: 'photos/index.html', text: renderFeed(list) }, { path: 'sitemap-photos.xml', text: renderPhotoSitemap(list) });
  const before = JSON.parse(ORIG.photos || '[]').filter(s => s.slug).map(s => s.slug), now2 = new Set(list.map(s => s.slug));
  before.forEach(sl => { if (!now2.has(sl)) out.push({ path: `photos/${sl}/index.html`, del: true }); });
  return out;
}


/* 책장: 공개된 글을 붙여 넣으면 장·문단으로 나눠 책으로 꽂는다. 목록(data/books.json)과 본문(data/books/<id>.json)을 따로 둔다 */
const BKINDS = [['novel', '소설'], ['poem', '시'], ['fairy', '동화'], ['essay', '수필']];
const BCOLORS = ['#5b2430', '#23314f', '#2f4a3a', '#7a5a2a', '#4a2a4e', '#2b2a2e', '#7a3b22', '#3d5560', '#d9c9a6'];
const BT = new Map(), BDIRTY = new Set();   // 고친 책 본문, 올려야 할 책 id
let editBook = null, bDraft = null;
const bSrcName = u => { try { const h = new URL(u).hostname; return /wikisource/.test(h) ? '위키문헌' : /gongu/.test(h) ? '공유마당' : /gutenberg/.test(h) ? '프로젝트 구텐베르크' : h.replace(/^www\./, ''); } catch (e) { return ''; } };
function bParas(lines, kind) {
  const txt = lines.join('\n').replace(/^\s*\n+|\n+\s*$/g, ''); if (!txt.trim()) return [];
  const blocks = txt.split(/\n[ \t　]*\n+/);
  if (kind === 'poem') return blocks.map(b => b.split('\n').map(l => l.replace(/^[ \t　]+/, '').replace(/\s+$/, '')).join('\n').trim()).filter(Boolean);
  const longLines = txt.split('\n').some(l => l.trim().length > 110);
  const out = (!longLines && blocks.length > 1) ? blocks.map(b => b.split('\n').map(l => l.trim()).filter(Boolean).join(' ')) : txt.split('\n');
  return out.map(x => x.replace(/[ \t　]+/g, ' ').trim()).filter(Boolean);
}
function bParse(raw, kind, strip) {
  let s = String(raw || '').replace(/\r\n?/g, '\n').replace(/[​-‍﻿]/g, '').replace(/ /g, ' ');
  if (strip) s = s.replace(/\[\s*(?:\d{1,3}|주\s*\d{1,3}|각주\s*\d{1,3}|편집|원문 보기)\s*\]/g, '').replace(/↑/g, '');
  const chs = []; let cur = { t: '', lines: [] };
  for (const ln of s.split('\n')) { const m = ln.match(/^\s*#\s+(.+?)\s*$/); if (m) { if (cur.t || cur.lines.some(x => x.trim())) chs.push(cur); cur = { t: m[1], lines: [] }; } else cur.lines.push(ln); }
  if (cur.t || cur.lines.some(x => x.trim())) chs.push(cur);
  return chs.map(c => ({ t: c.t, p: bParas(c.lines, kind) })).filter(c => c.t || c.p.length);
}
const bRaw = b => (b.chapters || []).map(c => (c.t ? '# ' + c.t + '\n\n' : '') + (c.p || []).join(b.kind === 'poem' ? '\n\n' : '\n')).join('\n\n');
const bStat = ch => { const n = ch.reduce((a, c) => a + c.p.reduce((x, y) => x + y.length, 0), 0); return { n, ch: ch.length, p: ch.reduce((a, c) => a + c.p.length, 0) }; };
const bSpine = c => `<span class="bspn" style="--c:${esc(c)}"></span>`;
function paneBooks() {
  if (editBook) return paneBook();
  $('#pane').innerHTML = `<p class="help">방의 책꽂이 아래 칸에 꽂히는 책이에요. 손님이 꺼내 읽고, 읽던 쪽은 손님 기기에만 기억돼요.</p>
  <ul class="list">${D.books.map((b, i) => `<li class="it${b.hide ? ' off' : ''}">${bSpine(b.color || BCOLORS[0])}<div class="f">
    <b style="font:600 16px/1.4 var(--serif)">${esc(b.t)}</b><small>${[b.a, b.tr ? b.tr + ' 옮김' : '', (BKINDS.find(k => k[0] === b.kind) || [0, '책'])[1], b.ch ? '장 ' + b.ch + '개' : '', b.n ? b.n.toLocaleString() + '자' : ''].filter(Boolean).map(esc).join(' · ')}${BDIRTY.has(b.id) ? ' · <span class="tag new">고침</span>' : ''}</small>
    <div class="row"><button class="btn sm" type="button" data-bed="${esc(b.id)}">고치기</button><button class="btn sm" type="button" data-bpv="${esc(b.id)}">미리 읽기</button>${moveBtns('books', i)}</div></div></li>`).join('')}</ul>
  <div class="add"><b>새 책 꽂기</b><p class="help" style="margin:0">위키문헌이나 공유마당 같은 곳에서 글을 그대로 복사해 붙여 넣어요. 장 제목과 문단은 자동으로 나눠요.</p>
    <div class="row"><button class="btn pri" type="button" id="bNew">새 책 만들기</button></div></div>`;
  wireList('books');
  $('#bNew').onclick = () => { bDraft = { id: rid(), t: '', a: '', tr: '', y: '', kind: 'novel', src: '', srcN: '', color: BCOLORS[D.books.length % BCOLORS.length], raw: '', strip: true, isNew: true }; editBook = bDraft.id; render(); };
  $$('[data-bed]').forEach(b => b.onclick = async () => { const full = await bLoad(b.dataset.bed); if (!full) return; bDraft = { ...full, raw: bRaw(full), strip: false }; editBook = full.id; render(); });
  $$('[data-bpv]').forEach(b => b.onclick = async () => { const full = await bLoad(b.dataset.bpv); if (full) bPreview(full); });
}
async function bLoad(id) {
  if (BT.has(id)) return BT.get(id);
  busy(true, '책을 펼치는 중…'); try { const j = await getJSON(`data/books/${id}.json`, null); busy(false); if (!j) { toast('책 본문을 찾지 못했어요'); return null; } BT.set(id, j); return j; }
  catch (e) { busy(false); toast('불러오지 못했어요'); return null; }
}
function bBuild(d) {
  const chapters = bParse(d.raw, d.kind, d.strip);
  return { id: d.id, t: d.t.trim(), a: d.a.trim(), tr: d.tr.trim(), y: String(d.y || '').trim(), kind: d.kind, src: d.src.trim(), srcN: d.srcN.trim() || bSrcName(d.src.trim()), color: d.color, chapters };
}
function bPreview(full) {
  window.__bookPreview = full; let o = $('#bkPrev');
  if (!o) { o = document.createElement('div'); o.id = 'bkPrev'; o.className = 'bkprev'; o.innerHTML = '<iframe title="미리 읽기"></iframe>'; document.body.appendChild(o);
    addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.bora === 'books-close') { o.hidden = true; o.querySelector('iframe').src = 'about:blank'; } }); }
  o.hidden = false; o.querySelector('iframe').src = '../books/?embed=1&preview=1';
}
function paneBook() {
  const d = bDraft; if (!d) { editBook = null; return paneBooks(); }
  const f = (k, label, ph, extra = '') => `<label class="fld"><span>${label}</span><input type="text" data-bf="${k}" value="${esc(d[k] || '')}" placeholder="${esc(ph)}" ${extra}></label>`;
  $('#pane').innerHTML = `<div class="row" style="margin-top:14px"><button class="btn sm" type="button" id="bBack">← 책장 목록</button></div>
  <div class="bed">
    ${f('t', '제목', '예: 메밀꽃 필 무렵')}
    <div class="two">${f('a', '지은이', '예: 이효석')}${f('tr', '옮긴이', '번역한 글이면')}</div>
    <div class="two">${f('y', '처음 나온 해', '예: 1936', 'inputmode="numeric"')}<label class="fld"><span>종류</span><select data-bf="kind">${BKINDS.map(([k, n]) => `<option value="${k}"${d.kind === k ? ' selected' : ''}>${n}</option>`).join('')}</select></label></div>
    ${f('src', '가져온 곳 주소', 'https://ko.wikisource.org/wiki/…', 'inputmode="url"')}
    ${f('srcN', '가져온 곳 이름', '비우면 주소를 보고 정해요 (예: 위키문헌)')}
    <div class="fld"><span>책등 색</span><div class="sw">${BCOLORS.map(c => `<button type="button" data-bc="${c}" aria-label="색 ${c}" aria-pressed="${d.color === c}" style="--c:${c}"></button>`).join('')}</div></div>
    <label class="fld"><span>본문</span><textarea data-bf="raw" rows="14" placeholder="여기에 글을 붙여 넣어요.&#10;&#10;# 첫째 장 제목&#10;문단…&#10;&#10;# 둘째 장 제목&#10;문단…">${esc(d.raw)}</textarea></label>
    <p class="help" style="margin:0">'# 장 제목'처럼 줄 맨 앞에 #과 한 칸을 두면 거기서 장이 나뉘어요. 시는 빈 줄로 연을 나눠요. 위키문헌에서 복사한 글은 문단마다 한 줄이라 그대로 붙여 넣으면 돼요.</p>
    <label class="chk"><input type="checkbox" id="bStrip"${d.strip ? ' checked' : ''}> 주석 번호([1], [편집] 같은 것) 지우기</label>
    <p class="bstat" id="bStat"></p>
    <p class="warnline">번역한 글은 옮긴이에게도 저작권이 있어요. 위키문헌·공유마당처럼 저작권이 끝났거나 자유 이용이 표시된 글만 넣어 주세요.</p>
    <div class="row"><button class="btn" type="button" id="bPv">미리 읽기</button><button class="btn pri" type="button" id="bOk">${d.isNew ? '책장에 꽂기' : '고친 내용 담기'}</button></div>
  </div>`;
  const stat = () => { const ch = bParse(d.raw, d.kind, d.strip), st = bStat(ch); $('#bStat').textContent = st.n ? `장 ${st.ch}개 · 문단 ${st.p.toLocaleString()}개 · 글자 ${st.n.toLocaleString()}자 · 휴대폰으로 약 ${Math.max(1, Math.round(st.n / 360))}쪽` : '아직 본문이 없어요.'; };
  stat();
  let t = 0; $$('[data-bf]').forEach(el => el.oninput = el.onchange = () => { d[el.dataset.bf] = el.value; clearTimeout(t); t = setTimeout(stat, 250); });
  $('#bStrip').onchange = e => { d.strip = e.target.checked; stat(); };
  $$('[data-bc]').forEach(b => b.onclick = () => { d.color = b.dataset.bc; $$('[data-bc]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $('#bBack').onclick = () => { editBook = null; bDraft = null; render(); };
  $('#bPv').onclick = () => { const full = bBuild(d); if (!full.chapters.length) { toast('본문을 먼저 붙여 넣어 주세요'); return; } bPreview(full); };
  $('#bOk').onclick = () => {
    const full = bBuild(d); if (!full.t) { toast('제목을 적어 주세요'); return; } if (!full.chapters.length) { toast('본문을 먼저 붙여 넣어 주세요'); return; }
    const st = bStat(full.chapters), meta = { id: full.id, t: full.t, a: full.a, tr: full.tr, y: full.y, kind: full.kind, src: full.src, srcN: full.srcN, color: full.color, n: st.n, ch: st.ch, v: new Date().toISOString() };
    const i = D.books.findIndex(x => x.id === full.id); if (i < 0) D.books.push(meta); else D.books[i] = { ...D.books[i], ...meta };
    BT.set(full.id, full); BDIRTY.add(full.id); mark('books'); editBook = null; bDraft = null; render(); toast(i < 0 ? '책장에 꽂았어요. 아래 \'방에 올리기\'를 눌러 주세요.' : '고친 내용을 담았어요.');
  };
}

/* 올리기 */
$('#saveAll').onclick = async () => {
  busy(true, '방에 올리는 중… (곡 파일이 크면 1분쯤 걸려요)');
  try { const files = [], used = new Set();
    if (dirty.has('photos')) files.push(...photoFiles());
    if (dirty.has('books')) { const now = new Set(D.books.map(b => b.id));
      for (const id of BDIRTY) if (now.has(id) && BT.has(id)) files.push({ path: `data/books/${id}.json`, text: JSON.stringify(BT.get(id)) });
      JSON.parse(ORIG.books || '[]').forEach(b => { if (!now.has(b.id)) files.push({ path: `data/books/${b.id}.json`, del: true }); }); }
    for (const k of dirty) { files.push({ path: FILES[k], text: JSON.stringify(D[k], null, 1) });
      for (const x of D[k]) for (const p of [x.f, x.day, x.night, ...((x.items || []).map(i => i.src))]) if (p && PEND.has(p) && !used.has(p)) { used.add(p); files.push({ path: p, blob: PEND.get(p) }); } }
    await commit(files, '주인장 방: ' + [...dirty].join(', ')); for (const p of used) PEND.delete(p); BDIRTY.clear();
    for (const k of dirty) ORIG[k] = JSON.stringify(D[k]); dirty.clear(); $('#saveBar').hidden = true; busy(false); toast('올렸어요. 1~2분 뒤 방에 보여요.'); render();
  } catch (e) { busy(false); toast('올리지 못했어요 (' + (e.status || '연결') + '). 잠시 뒤 다시 해 주세요.'); console.warn(e); }
};
$('#undoAll').onclick = () => { for (const k of dirty) D[k] = JSON.parse(ORIG[k]); dirty.clear(); PEND.clear(); editSet = null; editBook = null; bDraft = null; BDIRTY.clear(); BT.clear(); $('#saveBar').hidden = true; render(); };
window.addEventListener('beforeunload', e => { if (dirty.size) { e.preventDefault(); e.returnValue = ''; } });

async function start() {
  if (!KEY) return viewKey();
  $('#app').innerHTML = '<h1 class="lt">주인장 방</h1><p class="ls">불러오는 중…</p>';
  try { await loadAll(); render(); } catch (e) { if (e.status === 401) { localStorage.removeItem('bora_wkey'); KEY = ''; viewKey('열쇠가 맞지 않아요. 다시 넣어 주세요.'); } else $('#app').innerHTML = '<h1 class="lt">주인장 방</h1><p class="ls">불러오지 못했어요. 인터넷 연결을 확인해 주세요.</p>'; }
}
start();
</script>
