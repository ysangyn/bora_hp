<style>
.w .wrap{padding-bottom:120px}

.btn{appearance:none;border:1px solid var(--line);background:none;border-radius:999px;padding:10px 18px;font-size:14px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}

/* 편집 */

.imgx{position:absolute;top:8px;right:8px;z-index:2;border:0;border-radius:999px;background:rgba(0,0,0,.66);color:#fff;font-size:13px;padding:8px 12px;cursor:pointer}
.ed .lyric:empty::before{content:"가사를 적어요";color:var(--mut)}
.tools{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(12px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--surf) 94%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line)}

:root[data-theme=paper] .serp .t{color:#1a0dab}

.chk input{width:20px;height:20px}

.sheet h2{font:600 20px/1.4 var(--serif);margin:0 0 8px}
.pv{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.pv[hidden]{display:none}
.pv .pb{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mut)}
.pv iframe{flex:1;border:0;width:100%;background:var(--bg)}

<body class="w">
<header class="bar"><a class="logo" href="../../">보라다방</a><nav><a href="../">노트</a><a href="../../admin/">주인장 방</a><button class="theme" type="button" aria-label="밤·종이 화면 바꾸기"><i></i></button></nav></header>
<main class="wrap" id="app"></main>
<div class="sheet" id="sheet" hidden><div class="in" id="sheetIn"></div></div>
<div class="pv" id="pv" hidden><div class="pb"><span>미리보기 · 아직 올라가지 않았어요</span><button class="btn" id="pvX" type="button">닫기</button></div><iframe id="pvF" title="미리보기"></iframe></div>
<div class="busy" id="busy" hidden><span id="busyT">올리는 중…</span></div>
<script type="module">
import { SITE, CATS, catName, renderPost, renderList, renderSitemap, renderRss, autoSummary, plain } from '../../assets/notes-render.js';

const REPO = 'ysangyn/bora_hp', BRANCH = 'main';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const LS = { get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
let KEY = (() => { try { return localStorage.getItem('bora_wkey') || ''; } catch (e) { return ''; } })();
let tt = 0;
const toast = m => { let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); } t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2600); };
const busy = (on, t) => { $('#busy').hidden = !on; if (t) $('#busyT').textContent = t; };
$('.theme').onclick = () => { const r = document.documentElement, p = r.dataset.theme !== 'paper'; if (p) r.dataset.theme = 'paper'; else delete r.dataset.theme; try { localStorage.setItem('bora_theme', p ? 'paper' : 'night'); } catch (e) {} };

/* ── GitHub: 저장소에 바로 쓰기 ── */
async function gh(path, opt = {}) {
  const r = await fetch('https://api.github.com' + path, { ...opt, cache: 'no-store', headers: { Authorization: 'Bearer ' + KEY, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opt.body ? { 'Content-Type': 'application/json' } : {}) } });
  if (!r.ok) { const t = await r.text(); const e = new Error(r.status + ' ' + t.slice(0, 160)); e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}
const encPath = p => p.split('/').map(encodeURIComponent).join('/');
const b64dec = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g, '')), c => c.charCodeAt(0)));
const utf8b64 = s => { const u = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(bin); };
const blobB64 = b => new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(String(f.result).split(',')[1]); f.onerror = rej; f.readAsDataURL(b); });
async function getText(path) { try { const j = await gh(`/repos/${REPO}/contents/${encPath(path)}?ref=${BRANCH}`); return b64dec(j.content); } catch (e) { if (e.status === 404) return null; throw e; } }
async function getJSON(path, d) { const t = await getText(path); return t == null ? d : JSON.parse(t); }
async function commit(files, msg) {
  for (let attempt = 0; attempt < 3; attempt++) {
    const ref = await gh(`/repos/${REPO}/git/ref/heads/${BRANCH}`), base = ref.object.sha, bc = await gh(`/repos/${REPO}/git/commits/${base}`), tree = [];
    for (const f of files) {
      if (f.del) { tree.push({ path: f.path, mode: '100644', type: 'blob', sha: null }); continue; }
      const content = f.blob ? await blobB64(f.blob) : utf8b64(f.text);
      const b = await gh(`/repos/${REPO}/git/blobs`, { method: 'POST', body: JSON.stringify({ content, encoding: 'base64' }) });
      tree.push({ path: f.path, mode: '100644', type: 'blob', sha: b.sha });
    }
    const t = await gh(`/repos/${REPO}/git/trees`, { method: 'POST', body: JSON.stringify({ base_tree: bc.tree.sha, tree }) });
    const c = await gh(`/repos/${REPO}/git/commits`, { method: 'POST', body: JSON.stringify({ message: msg, tree: t.sha, parents: [base] }) });
    try { await gh(`/repos/${REPO}/git/refs/heads/${BRANCH}`, { method: 'PATCH', body: JSON.stringify({ sha: c.sha }) }); return c.sha; }
    catch (e) { if (e.status !== 422 || attempt === 2) throw e; }          // 그 사이 다른 변경이 들어왔으면 다시
  }
}

/* ── 사진: 이 기기 안에서 줄이고(최대 1600px) 위치 정보 없이 다시 저장 ── */
const IDB = (() => { let dbp = null; const db = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open('bora_write', 1); r.onupgradeneeded = () => r.result.createObjectStore('img'); r.onsuccess = () => res(r.result); r.onerror = rej; }));
  const tx = async (m, f) => { const d = await db(); return new Promise((res, rej) => { const t = d.transaction('img', m), s = t.objectStore('img'), q = f(s); t.oncomplete = () => res(q && q.result); t.onerror = rej; }); };
  return { put: (k, v) => tx('readwrite', s => s.put(v, k)).catch(() => {}), get: k => tx('readonly', s => s.get(k)).catch(() => null), del: k => tx('readwrite', s => s.delete(k)).catch(() => {}) }; })();
async function shrink(file) {
  let bmp; try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w0 = bmp.width, h0 = bmp.height, k = Math.min(1, 1600 / Math.max(w0, h0)), w = Math.round(w0 * k), h = Math.round(h0 * k);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const g = cv.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(bmp, 0, 0, w, h);
  let blob = await new Promise(r => cv.toBlob(r, 'image/webp', .84)); let ext = 'webp';
  if (!blob || blob.type !== 'image/webp') { blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .86)); ext = 'jpg'; }
  return { blob, ext, w, h };
}
const PEND = new Map();      // 'img/notes/…' → blob (아직 올리지 않은 사진)

/* ── 상태 ── */
let INDEX = null, TRACKS = [], cur = null, saveT = 0;
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const ROOT = '../../';
const toView = html => String(html || '').replace(/(<img\b[^>]*?\bsrc=")(img\/)/g, `$1${ROOT}$2`);

async function loadIndex() { INDEX = await getJSON('data/notes.json', []); return INDEX; }
async function loadTracks() { try { TRACKS = await (await fetch(ROOT + 'data/tracks.json', { cache: 'no-store' })).json(); } catch (e) { TRACKS = []; } }

/* ── 화면 1: 쓰기 열쇠 ── */
function viewKey(err) {
  $('#app').innerHTML = `<h1 class="lt">노트 쓰기</h1>
  <p class="ls">이 기기에서 처음 한 번만 '쓰기 열쇠'를 넣으면 돼요.</p>
  <div class="card" style="margin-top:24px">
    <label class="f" for="kIn" style="margin-top:0">쓰기 열쇠</label>
    <input type="password" id="kIn" autocomplete="off" placeholder="github_pat_…" value="">
    ${err ? `<p class="warnline">${esc(err)}</p>` : ''}
    <div class="row" style="margin-top:14px"><button class="btn pri" id="kOk" type="button">열쇠 넣기</button></div>
    <div class="help" style="margin-top:18px">열쇠는 이 휴대폰(브라우저)에만 저장돼요. 휴대폰을 잃어버리면 GitHub에서 그 열쇠를 지우면 돼요.
      <details style="margin-top:10px"><summary>열쇠 만드는 법 (영상이가 한 번 만들어 주면 돼요)</summary>
      <ol><li>GitHub 로그인 → 오른쪽 위 사진 → Settings → 맨 아래 Developer settings</li>
      <li>Personal access tokens → <b>Fine-grained tokens</b> → Generate new token</li>
      <li>이름: 보라다방 노트 · 만료일: 가장 길게</li>
      <li>Repository access: <b>Only select repositories</b> → <b>bora_hp</b></li>
      <li>Permissions → Repository permissions → <b>Contents: Read and write</b></li>
      <li>Generate token → 나온 글자(github_pat_로 시작)를 복사해 위 칸에 붙여 넣기</li></ol></details></div>
  </div>`;
  $('#kOk').onclick = async () => {
    const k = $('#kIn').value.trim(); if (!k) return;
    KEY = k; busy(true, '열쇠를 확인하는 중…');
    try { const j = await gh(`/repos/${REPO}`); if (!(j.permissions && j.permissions.push)) throw new Error('이 열쇠로는 글을 올릴 수 없어요. Contents 권한을 Read and write로 해 주세요.');
      try { localStorage.setItem('bora_wkey', k); } catch (e) {} busy(false); toast('열쇠를 넣었어요'); route();
    } catch (e) { busy(false); KEY = ''; viewKey(e.status === 401 ? '열쇠가 맞지 않아요. 다시 복사해 주세요.' : (e.message || '확인하지 못했어요')); }
  };
}

/* ── 화면 2: 내 노트 목록 ── */
async function viewList() {
  $('#app').innerHTML = `<h1 class="lt">노트 쓰기</h1><p class="ls">불러오는 중…</p>`;
  let idx; try { idx = await loadIndex(); } catch (e) { if (e.status === 401) { forgetKey(); return; } $('#app').innerHTML = `<h1 class="lt">노트 쓰기</h1><p class="ls">목록을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</p>`; return; }
  const drafts = Object.keys(localStorage).filter(k => k.startsWith('bora_draft_')).map(k => LS.get(k)).filter(Boolean).sort((a, b) => (b.saved || 0) - (a.saved || 0));
  const dIds = new Set(drafts.map(d => d.id));
  $('#app').innerHTML = `<h1 class="lt">노트 쓰기</h1>
  <p class="ls">글 ${idx.length}편${drafts.length ? ` · 이 기기에 쓰다 만 글 ${drafts.length}편` : ''}</p>
  <div class="row" style="margin-top:22px"><button class="btn lamp" id="nNew" type="button">＋ 새 노트 쓰기</button><a class="btn" href="../">노트 보러 가기</a></div>
  <ul class="mine">${drafts.map(d => `<li><button type="button" data-d="${esc(d.id)}"><span class="tag d">쓰는 중</span><span><b>${esc(d.title || '(제목 없음)')}</b><small>${new Date(d.saved).toLocaleString('ko-KR')} 저장</small></span></button></li>`).join('')}
  ${idx.filter(p => !dIds.has(p.id)).map(p => `<li><button type="button" data-p="${esc(p.id)}"><span class="tag">${esc(catName(p.cat))}</span><span><b>${esc(p.title)}</b><small>${p.date.slice(0, 10).replace(/-/g, '.')}</small></span></button></li>`).join('')}</ul>
  <div class="help" style="margin-top:40px">쓰다 만 글은 이 기기에만 남아요. 올린 글을 고치려면 목록에서 누르세요.<br><button class="btn" id="kOut" type="button" style="margin-top:12px">이 기기에서 열쇠 빼기</button></div>`;
  $('#nNew').onclick = () => openEditor(null);
  $$('[data-d]').forEach(b => b.onclick = () => openEditor(LS.get('bora_draft_' + b.dataset.d), true));
  $$('[data-p]').forEach(b => b.onclick = async () => { busy(true, '불러오는 중…'); try { const p = await getJSON(`data/notes/${b.dataset.p}.json`, null); busy(false); if (p) openEditor(p); else toast('글을 찾지 못했어요'); } catch (e) { busy(false); toast('불러오지 못했어요'); } });
  $('#kOut').onclick = () => { forgetKey(); };
}
function forgetKey() { try { localStorage.removeItem('bora_wkey'); } catch (e) {} KEY = ''; viewKey(); }

/* ── 화면 3: 쓰기 ── */
async function openEditor(p, isDraft) {
  if (!INDEX) { try { await loadIndex(); } catch (e) { INDEX = []; } }
  const published = p && INDEX.some(x => x.id === p.id);
  cur = p ? { ...p } : { id: rid(), title: '', cat: 'day', body: '', song: '', summary: '', cover: '', date: today(), keepPlace: true };
  cur.published = published; cur.manualSum = !!(p && p.summary && p.summary !== autoSummary(p.body));
  if (isDraft) for (const im of (cur.body.match(/data-path="[^"]+"/g) || [])) { const k = im.slice(11, -1); const b = await IDB.get(k); if (b) PEND.set(k, b); }
  const placeName = (LS.get('place6', null) || {}).name || '';
  $('#app').innerHTML = `
  <div class="ebar"><button class="btn" id="eBack" type="button">← 목록</button><span class="st" id="eSt">${published ? '올라간 글 고치는 중' : '새 노트'}</span><button class="btn" id="ePv" type="button">미리보기</button></div>

  sheet(`<h2>이 글을 지울까요?</h2><p class="help">노트에서 사라지고 되돌릴 수 없어요. 이 기기에 쓰던 내용은 남아요.</p><div class="row" style="margin-top:14px"><button class="btn warn" id="xOk" type="button">지우기</button><button class="btn" id="xNo" type="button">그만두기</button></div>`);
  $('#xNo').onclick = closeSheet;
  $('#xOk').onclick = async () => { closeSheet(); busy(true, '지우는 중…');
    try { const all = await loadIndex(), i = all.findIndex(x => x.id === cur.id), old = all[i]; const list = all.filter(x => x.id !== cur.id);
      const ids = [all[i - 1] && all[i - 1].id, all[i + 1] && all[i + 1].id].filter(Boolean);
      const files = [{ path: `data/notes/${cur.id}.json`, del: true }, ...(old ? [{ path: `notes/${old.slug}/index.html`, del: true }] : []), ...(await pagesFor(list, ids)), ...commonFiles(list)];
      await commit(files, `노트 지움: ${cur.title}`); INDEX = list; busy(false); toast('지웠어요'); route('list');
    } catch (e) { busy(false); toast('지우지 못했어요 (' + (e.status || '연결') + ')'); } };
}
function sheet(html) { $('#sheetIn').innerHTML = html; $('#sheet').hidden = false; }
function closeSheet() { $('#sheet').hidden = true; }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });

/* ── 길 찾기 ── */
async function route(to) {
  if (!KEY) return viewKey();
  if (!TRACKS.length) await loadTracks();
  const m = location.hash.match(/edit=([\w-]+)/);
  if (!to && m) { history.replaceState(null, '', location.pathname); busy(true, '불러오는 중…'); try { const p = await getJSON(`data/notes/${m[1]}.json`, null); busy(false); if (p) return openEditor(p); } catch (e) { busy(false); } }
  viewList();
}
window.addEventListener('beforeunload', () => saveLocal());
document.addEventListener('visibilitychange', () => { if (document.hidden) saveLocal(); });
route();
</script>
